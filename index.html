<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1 in 88 Billion</title>
<meta name="description" content="Be born as a farmed animal and live the whole life, built on published welfare research.">
<style>
:root{
  --bg:#f6f3ec;--fg:#23221f;--muted:#625f57;--card:#fffdf8;--line:#d9d2c0;--accent:#8a3b2a;--accent-fg:#fff;
  --H:#4f8a4a;--C:#b9801f;--B:#3f7399;--O:#8d5a9c;--bar:#e6dfce;--warn:#8a3b2a;--ic:#8a6a4a;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#181714;--fg:#efebe0;--muted:#aaa699;--card:#22211d;--line:#3a3830;--accent:#e08a72;--accent-fg:#1a1411;--bar:#34322b;
  --H:#86b87f;--C:#dcab55;--B:#7eabce;--O:#c195ce;--warn:#e08a72}
}
*{box-sizing:border-box}
html{color-scheme:light dark;font-size:18px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Segoe UI",Helvetica,Arial,sans-serif;line-height:1.7}
:lang(en) h1,:lang(en) h2{font-family:Georgia,"Times New Roman",serif}
main{max-width:1020px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:clamp(2.4rem,7vw,4rem);line-height:1.08;margin:.15em 0 .2em;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.3rem;line-height:1.35;margin:0 0 .5em;font-weight:700}
p{margin:.55em 0}
.muted{color:var(--muted)}
.small{font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:16px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:860px){.grid{grid-template-columns:1.3fr 1fr}}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:10px 16px;min-height:44px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700;padding:14px 30px;font-size:1.15rem}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-radius:0;padding:8px 14px;min-height:42px}
.seg button.on{background:var(--accent);color:var(--accent-fg);font-weight:700}
.counters{display:grid;grid-template-columns:1fr;gap:12px;margin:20px 0}
@media(min-width:660px){.counters{grid-template-columns:1fr 1fr}}
.big{font-size:2.3rem;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.note{border-left:4px solid var(--warn);padding:8px 14px;background:color-mix(in srgb,var(--warn) 9%,transparent);border-radius:0 8px 8px 0}
.stat{margin:12px 0}
.stat .lbl{display:flex;justify-content:space-between;font-size:1rem;font-weight:600}
.bar{height:14px;background:var(--bar);border-radius:7px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;transition:width .4s;border-radius:7px}
.log{max-height:420px;overflow:auto;padding:0;margin:0;list-style:none}
.log li{padding:10px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:84px 1fr;gap:12px;font-size:1.02rem}
.log .a{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:.75rem;border:1px solid var(--line);border-radius:12px;padding:0 9px;margin-left:8px;color:var(--muted);white-space:nowrap}
.evt{font-size:1.2rem;min-height:6em;line-height:1.75}
.hm{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:1rem}
.hm .s{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.hm.d .s{color:var(--warn);font-weight:600}
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:color-mix(in srgb,var(--ic) 14%,var(--card));border-color:color-mix(in srgb,var(--ic) 40%,var(--line))}
.hero .pic{width:132px;height:100px;color:var(--ic)}
@media(min-width:620px){.hero .pic{width:190px;height:140px}}
.hero .kind{font-size:clamp(1.9rem,6vw,3rem);font-weight:800;line-height:1.1}
.hero .sys{font-size:1.1rem}
.age{font-size:2.1rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.strip{display:flex;height:26px;border-radius:6px;overflow:hidden;background:var(--bar);position:relative}
.strip span{display:block;height:100%;border-right:2px solid var(--card)}
.strip .now{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--fg)}
.pause{border:3px solid var(--accent)}
input[type=text]{width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
details{margin:10px 0}summary{cursor:pointer;font-weight:700}
table{border-collapse:collapse;width:100%;font-size:.95rem}td,th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
a{color:var(--accent)}
.hide{display:none!important}
svg text{fill:var(--muted);font:12px sans-serif}
.zoo{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 6px}
.zoo svg{width:78px;height:58px;color:var(--ic)}
.bob{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.bob{animation:none}}
</style>
</head>
<body>
<main>

<div class="top"><div class="muted small" data-t="beta"></div>
  <div class="seg" id="segLang" role="group" aria-label="Language"><button data-v="en">English</button><button data-v="ja">日本語</button></div></div>

<!-- HOME -->
<section id="home">
  <h1 data-t="title"></h1>
  <div class="zoo" id="zoo" aria-hidden="true"></div>
  <p style="font-size:1.15rem" data-t="intro1"></p>
  <p style="font-size:1.15rem" data-t="intro2"></p>

  <div class="counters">
    <div class="card"><div class="big" id="cSlaughter">0</div><div class="muted" data-t="cnt1"></div></div>
    <div class="card"><div class="big" id="cChick">0</div><div class="muted" data-t="cnt2"></div></div>
  </div>

  <div class="card">
    <h2 data-t="howBorn"></h2>
    <div class="row" style="margin-bottom:8px">
      <div class="seg" id="segMode" role="group"><button data-v="real" data-t="modeReal"></button><button data-v="equal" class="on" data-t="modeEqual"></button></div>
    </div>
    <p class="small muted" id="modeHelp"></p>
    <h2 style="margin-top:16px" data-t="howLong"></h2>
    <div class="seg" id="segLen" role="group"><button data-v="3" data-t="len3"></button><button data-v="6" class="on" data-t="len6"></button><button data-v="10" data-t="len10"></button></div>
    <p class="small muted" data-t="lenHelp"></p>
    <div style="margin-top:18px"><button class="primary" id="btnBorn" data-t="born"></button> <button id="btnResume" class="hide" data-t="resume"></button></div>
    <div class="note small" style="margin-top:16px" data-t="warn"></div>
  </div>

  <div class="card"><h2 data-t="tallyH"></h2><div id="tallyBody" class="small"></div></div>

  <details class="card">
    <summary data-t="realH"></summary>
    <p class="small" data-t="real1"></p>
    <p class="small" data-t="real2"></p>
    <p class="small" data-t="real3"></p>
    <p class="small"><a href="research.md" target="_blank" rel="noopener" data-t="srcLink"></a></p>
    <div class="small" id="srcList"></div>
  </details>
  <p class="small muted" data-t="credit"></p>
</section>

<!-- LIFE -->
<section id="life" class="hide">
  <div class="card hero">
    <div class="pic bob" id="heroPic" aria-hidden="true"></div>
    <div>
      <div class="kind" id="heroKind"></div>
      <div class="sys" id="heroSys"></div>
      <div class="muted small" id="heroSex"></div>
      <div class="age" id="lAge" style="margin-top:6px">0</div>
    </div>
  </div>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button id="btnPause" data-t="pause"></button>
      <div class="seg" id="segSpeed" role="group"><button data-v="1" class="on">1×</button><button data-v="2">2×</button><button data-v="4">4×</button><button data-v="8">8×</button><button data-v="16">16×</button></div>
      <button id="btnNext" data-t="next"></button>
    </div>
    <button id="btnHome" data-t="leave"></button>
  </div>

  <div class="grid">
    <div>
      <div class="card"><div class="evt" id="evt"></div></div>
      <div class="card pause hide" id="pauseCard">
        <h2 id="pTitle"></h2>
        <p id="pNature"></p>
        <p id="pSys" class="muted"></p>
        <p><b id="pQ"></b></p>
        <input type="text" id="pNote" maxlength="140" data-ph="notePh" aria-label="note">
        <div style="margin-top:12px"><button class="primary" id="btnCont" data-t="cont"></button></div>
      </div>
      <div class="card"><h2 data-t="record"></h2><ul class="log" id="log"></ul></div>
    </div>
    <div>
      <div class="card"><h2><span data-t="stateH"></span> <span class="muted small" data-t="stateSub"></span></h2><div id="stats"></div></div>
      <div class="card">
        <h2 data-t="scaleH"></h2>
        <div class="strip" id="strip"></div>
        <div class="small muted" id="stageNow" style="margin:5px 0 12px"></div>
        <div class="small"><span data-t="vsNat"></span> (<span id="natTxt"></span>)</div>
        <div class="strip" style="margin-top:5px"><span id="natFill" style="background:var(--accent);width:1%;border:0"></span></div>
        <div class="small muted" id="natPct"></div>
      </div>
      <div class="card"><h2 data-t="sameSec"></h2><p class="small muted" data-t="sameSecHelp"></p><div id="hm"></div></div>
    </div>
  </div>
</section>

<!-- END -->
<section id="end" class="hide">
  <div class="card hero">
    <div class="pic" id="endPic" aria-hidden="true"></div>
    <div><div class="muted small" id="eTitle"></div><h1 id="eHead" style="margin:.1em 0"></h1><div id="eCause" style="font-size:1.15rem"></div></div>
  </div>
  <div class="card"><h2 data-t="endNatH"></h2><p id="eNat" style="font-size:1.1rem"></p></div>
  <div class="card"><h2 data-t="endStateH"></h2><div id="eSpark"></div></div>
  <div class="card"><h2 data-t="endSurvH"></h2><div id="eSurv"></div><p class="small muted" id="eSurvTxt"></p></div>
  <div class="card" id="eNotes"></div>
  <div class="row"><button class="primary" id="btnAgain" data-t="again"></button><button id="btnHome2" data-t="home"></button></div>
</section>

</main>

<script>
'use strict';
/* ================= helpers ================= */
const rnd = Math.random;
const rr = (a, b) => a + rnd() * (b - a);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const gauss = (mu, s) => { let u = 0; for (let i = 0; i < 6; i++) u += rnd(); return mu + (u - 3) * 1.414 * s; };
const pick = a => a[Math.floor(rnd() * a.length)];
const wpick = o => { let t = 0; for (const k in o) t += o[k]; let r = rnd() * t; for (const k in o) { r -= o[k]; if (r <= 0) return k; } return Object.keys(o)[0]; };
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* ================= language ================= */
let LANG = store.get('fl.lang', null) || ((navigator.language || '').toLowerCase().startsWith('ja') ? 'ja' : 'en');
const m = (e, j, ...a) => ({ e, j, a });                      // a bilingual message
const fmtArg = v => (v && typeof v === 'object') ? ('span' in v ? spanTxt(v.span) : 'age' in v ? ageTxt(v.age) : 'msg' in v ? tx(v.msg) : v) : v;
const tx = x => { if (x == null) return ''; if (typeof x === 'string') return x; const s = (LANG === 'ja' ? x.j : x.e) || x.e; return s.replace(/\{(\d)\}/g, (_, i) => fmtArg(x.a[i])); };
function ageTxt(d) {
  const ja = LANG === 'ja';
  if (d < 1) return Math.max(0, Math.floor(d * 24)) + (ja ? '時間' : ' h old');
  if (d < 21) return ja ? Math.floor(d) + '日目' : 'Day ' + Math.floor(d);
  if (d < 120) return Math.floor(d / 7) + (ja ? '週' : ' weeks');
  if (d < 730) return Math.floor(d / 30.4) + (ja ? 'か月' : ' months');
  const y = Math.floor(d / 365.25), mo = Math.floor((d - y * 365.25) / 30.4);
  return ja ? y + '歳' + mo + 'か月' : y + ' y ' + mo + ' m';
}
function spanTxt(d) {
  const ja = LANG === 'ja';
  if (d < 1) return ja ? '1日未満' : 'under a day';
  if (d < 21) return Math.round(d) + (ja ? '日' : ' days');
  if (d < 120) return Math.round(d / 7) + (ja ? '週間' : ' weeks');
  if (d < 730) return Math.round(d / 30.4) + (ja ? 'か月' : ' months');
  return (d / 365.25).toFixed(1) + (ja ? '年' : ' years');
}
const UI = {
  beta: ['Beta · a free life simulator · built from published welfare research', 'ベータ版 · 無料の人生シミュレーター · 公表された動物福祉の研究をもとにしています'],
  title: ['1 in 88 billion', '880億分の1'],
  intro1: ['About 88 billion land animals are slaughtered for food each year. That is roughly 2,800 every second. This page makes you one of them. You do not choose the species or the farm. Neither did they.', '毎年、およそ880億頭の陸の動物が、食べるために殺されています。1秒に約2,800頭。このページでは、あなたがそのうちの1頭として生まれます。どんな動物に、どこの農場に生まれるかは、くじ引きで決まります。'],
  intro2: ['You make no decisions here. You watch one life from the first hour to the last, at the speed you pick.', '操作は、見る速さを変えるだけ。生まれたその瞬間から最期まで、ひとつの生涯を見届けます。'],
  cnt1: ['land animals slaughtered since you opened this page', 'このページを開いてから、屠殺された陸の動物の数'],
  cnt2: ['of them chickens (about 4 in 5)', 'うちニワトリ（およそ5羽に4羽）'],
  howBorn: ['How you are born', 'どんな動物として生まれるか'],
  modeReal: ['By real numbers', '実際の数にそって'], modeEqual: ['Equal chance per species', 'どの種も同じ確率で'],
  modeRealHelp: ['Your species is drawn in proportion to how many of each are born into farming each year. Most likely you will be a chicken raised for meat.', '毎年、畜産の現場で生まれる数に比例して、種が決まります。いちばん多いのは、食肉用のニワトリです。'],
  modeEqualHelp: ['Every species is equally likely. You are as likely to be a rabbit as a broiler chicken. In life, that is not the case.', 'どの種も同じ確率で選ばれます。ウサギもブロイラーも、出る確率は同じです。現実の数とは大きく違います。'],
  howLong: ['How long the life takes to watch', '見届ける長さ'],
  len3: ['About 3 min', '約3分'], len6: ['About 6 min', '約6分'], len10: ['About 10 min', '約10分'],
  lenHelp: ['This is the length for a typical life of the species you draw. A day-old chick\'s life is short on any setting. You can pause and speed up at any time.', 'その種の、ふつうの一生をこの長さで再生します。生後1日で終わる命は、どの設定でも短くなります。一時停止も倍速も、いつでも使えます。'],
  born: ['Be born', '生まれる'], resume: ['Back to my life', '続きから'],
  warn: ['Death, disease, injury, mutilation and slaughter all appear, as the research describes them. Nothing is drawn in detail. The text is plain, and it is not gentle.', '死、病気、けが、身体の切除、屠殺。研究に書かれているとおりに、すべて出てきます。場面を細かく描くことはしませんが、文章はやさしくありません。'],
  tallyH: ['Lives you have lived', 'これまで生きた命'], tallyNone: ['None yet. Saved only in this browser.', 'まだありません。記録はこのブラウザにだけ保存されます。'], tallyClear: ['Clear my record', '記録を消す'],
  realH: ['What is real data and what is not', '実際のデータと、そうでないもの'],
  real1: ['Each event comes from a published source or, where I could not find one, is marked as an estimate in the source list (link below). The odds on this page (how likely a piglet is to be crushed, how many hens have broken keel bones) come from the studies listed below. Some come from advocacy groups, and the source list says which.', '各イベントは、公表されている資料にもとづいています。資料が見つからなかったものは、下のリンク先の出典一覧に「推定」と書いてあります。子豚が圧死する割合、採卵鶏の竜骨が折れる割合などの数字は、下に挙げた研究から取りました。動物保護団体の資料も含まれていて、どれがそうかも、その一覧で区別しています。'],
  real2: ['The four bars are a model, not a measurement. They loosely follow the Five Domains framework of animal welfare science. Health is injury and disease. Comfort is space, air, floor and temperature. Behaviour is whether the animal can do what its body is built to do. Company is contact with a mother, flock or herd. We cannot measure what an animal feels, and this app does not claim to.', '4本のバーは、測定値ではなく、あくまでモデルです。動物福祉科学の「5つの領域」という考え方を、ゆるく参考にしました。健康はけがや病気、快適さは広さ・空気・床・温度、行動は本来できることができているか、仲間は母親や群れとのつながりです。動物が実際に何を感じているかは測れませんし、このアプリもそこまでは言いません。'],
  real3: ['Left out: farmed fish (trillions, counted differently), goats, geese, horses, and breeding animals other than sows and dairy cows. Most sheep live on open pasture, not in factory farms, and the app shows that.', '含めていないもの：養殖魚（数兆匹にのぼり、数え方も違います）、ヤギ、ガチョウ、ウマ、母豚と乳牛以外の繁殖用の動物。なお、ヒツジの大半は工場式ではなく放牧地で育ちます。このアプリでも、そのとおりに扱っています。'],
  srcLink: ['Full source list with confidence notes (research.md, in English)', '出典と確度の一覧（research.md・英語）'],
  credit: ['Not affiliated with 1in8b.life. The idea of living one random life is theirs. All code, text and data here are new.', '1in8b.life とは関係がありません。「ランダムに生まれて、ひとつの人生を生きる」という発想はあちらのものです。コード、文章、データは、すべて新しく作りました。'],
  pause: ['Pause', '一時停止'], play: ['Resume', '再開'], next: ['Next »', '次へ »'], leave: ['Leave', '中断'], cont: ['Continue', '続ける'],
  notePh: ['Leave a line, if you want. It stays in this browser.', '一行、書き残してもかまいません。このブラウザにだけ保存されます。'],
  record: ['The record', '記録'], stateH: ['State', '状態'], stateSub: ['0–100 · a model', '0〜100・モデル'],
  scaleH: ['This life, to scale', '生涯の長さ'], vsNat: ['Against a natural lifespan', '自然な寿命と比べると'],
  sameSec: ['Born in the same second', '同じ1秒に生まれた命'], sameSecHelp: ['Four others, drawn the same way. Their lives run alongside yours.', 'ほかに4頭、同じやり方で選ばれました。あなたの生涯と並んで進みます。'],
  endNatH: ['How long, against a natural life', '自然な寿命と比べて'], endStateH: ['State over this life', '状態の移り変わり'],
  endSurvH: ['Of 400 animals born into this same system', '同じ飼育方式に生まれた400頭では'],
  again: ['Be born again', 'もう一度生まれる'], home: ['Home', 'ホームへ'],
  pt0: ['The beginning', 'はじまり'], pt1: ['Midway', '中ごろ'], pt2: ['Near the end', '終わりが近づく'],
  inNature: ['In nature: ', '自然のなかでは：'], inNatureGen: ['In nature, this animal would live for {0}.', 'この動物は、自然のなかなら{0}ほど生きます。'], here: ['Here: ', 'この場所では：'],
  q0: ['If this animal could choose one thing right now, what would it be?', 'いまこの動物が何か一つ選べるとしたら、何を選ぶでしょうか。'],
  q1: ['What is this body being asked to do that it was not built for?', 'この体は、本来の作りとは違うどんなことを求められているでしょう。'],
  q2: ['Who is missing from this scene?', 'この場面にいてほしいのは、誰でしょうか。'],
  q3: ['What would you want someone to notice about this moment?', 'この瞬間について、誰かに気づいてほしいことはありますか。']
};
const ui = k => UI[k][LANG === 'ja' ? 1 : 0];
function applyLang() {
  document.documentElement.lang = LANG;
  document.title = LANG === 'ja' ? '880億分の1' : '1 in 88 Billion';
  document.querySelectorAll('[data-t]').forEach(el => { const u = UI[el.dataset.t]; if (u) el.textContent = u[LANG === 'ja' ? 1 : 0]; });
  document.querySelectorAll('[data-ph]').forEach(el => { el.placeholder = UI[el.dataset.ph][LANG === 'ja' ? 1 : 0]; });
  [...$('segLang').children].forEach(b => b.classList.toggle('on', b.dataset.v === LANG));
  $('modeHelp').textContent = ui(A.mode === 'real' ? 'modeRealHelp' : 'modeEqualHelp');
  $('btnPause').textContent = ui(A.paused ? 'play' : 'pause');
  renderSources(); renderTally();
  if (A.V === 'life') relife();
  if (A.V === 'end') endScreen();
}

};
const tg = k => TG[k] ? TG[k][LANG === 'ja' ? 1 : 0] : k;

/* ================= life construction ================= */
function die(L, planned, wins, slMsg) {
  let end = planned, cause = slMsg, sl = true;
  for (const w of wins) if (w[2] > 0 && rnd() < w[2]) { const d = rr(w[0], w[1]); if (d < end) { end = d; cause = w[3]; sl = false; } }
  L.end = Math.max(end, 0.05); L.cause = cause; L.slaughtered = sl;
}
function E(L, d, msg, fx, tag, p) {
  if (p != null && rnd() > p) return;
  if (Array.isArray(d)) d = rr(d[0], d[1]);
  if (d >= L.end - 0.0001) return;
  L.ev.push({ d, msg, fx: fx || {}, tag: tag || '' });
}
function final(L, preMsg, atMsg, deathMsg) {
  if (L.slaughtered) E(L, Math.max(0.02, L.end - 0.4), preMsg, { C: -15, B: -10 }, 'Transport');
  L.ev.push({ d: L.end, msg: L.slaughtered ? atMsg : (deathMsg || m('The life ends here. Cause: {0}.', 'ここで生涯が終わります。原因は{0}。', { msg: L.cause })), fx: { H: -100 }, tag: L.slaughtered ? 'Slaughter' : 'Death', fin: true });
}
const stages = (L, arr) => { L.st = arr.filter(s => s[1] < L.end); };
const SX = { male: m('male', 'オス'), female: m('female', 'メス') };
const slAt = (days) => m('Slaughtered at {0}', '{0}で食肉処理されました', { span: days });
const slAtD = (days) => m('Slaughtered at {0} days', '{0}日齢で食肉処理', Math.round(days));

const SP = {};

/* ---------- broiler ---------- */
SP.broiler = { label: m('Broiler chicken', '肉用鶏（ブロイラー）'), nat: m('5–8 years', '5〜8年'), natDays: 2555,
  nature: [m('A hen sits on her eggs for about three weeks, then keeps her chicks under her for the first weeks and teaches them what to eat.', '雌鶏は3週間ほど卵を温め、ひなが生まれたあとも数週間は羽の下に入れて、何を食べればいいか教えます。'), m('Junglefowl spend much of the day walking, scratching and foraging, and roost off the ground at night.', 'ニワトリの祖先にあたる野鶏は、昼のほとんどを歩いて地面をかき、エサを探して過ごします。夜は地面から離れた枝で眠ります。'), m('A chicken that reaches adulthood grows slowly over months. A modern broiler reaches slaughter weight in about six weeks.', '本来のニワトリは、数か月かけてゆっくり大人になります。いまのブロイラーは、およそ6週間で出荷の体重に届きます。')],
  build(L) {
    const s = L.o.sys || wpick({ fast: .86, slow: .09, out: .05 }); L.sys = s; L.sex = pick(['male', 'female']);

    const fast = s === 'fast';
    const planned = fast ? clamp(gauss(42, 3), 34, 50) : s === 'slow' ? rr(56, 70) : rr(70, 81);
    L.typ = fast ? 42 : s === 'slow' ? 63 : 75;

    L.slope = { H: fast ? -34 : -8, C: fast ? -20 : -4, B: fast ? -8 : 0, O: 0 };
    L.sysLine = fast ? m('One open floor, tens of thousands of birds, artificial light, a breed that gains about 100 g a day.', '仕切りのない一つの床に、数万羽。照明は人工。1日に100gほど太る品種です。') : s === 'slow' ? m('A slower-growing breed with more space, perches or bales to use, and natural light.', '成長がゆっくりの品種で、広さに余裕があり、止まり木やわらの束を使えます。自然光も入ります。') : m('A slower-growing breed with daytime access to outdoor range.', '成長がゆっくりの品種で、昼間は屋外の運動場に出られます。');
    die(L, planned, [
      [0, 7, fast ? .015 : .01, m('Died in the first week (failed to start eating, chilled, or a weak yolk sac)', '生後1週間のうちに死亡（食べ始められなかった、体が冷えた、卵黄をうまく吸収できなかった、など）')],
      [7, planned, fast ? .047 : .015, fast ? m('Heart failure or ascites (fluid build-up), a known cost of very fast growth', '心不全や腹水（おなかに水がたまる病気）。急成長の代償としてよく知られている') : m('Disease on the farm', '農場での病気')],
      [10, planned, fast ? .03 : .008, m('Sudden death syndrome', '突然死症候群')],
      [10, planned, fast ? .02 : .005, m('Culled by the farmer because it could not walk to food or water', '餌や水まで歩けなくなり、農場の判断で殺処分された')],
      [planned - 1, planned, .004, m('Died on the truck or in the crates', '輸送中、またはカゴの中で死亡')]
    ], slAtD(planned));
    E(L, 0, m('You hatch in a machine, in a room with thousands of others. No hen ever sat on your egg. You will not meet a parent.', '機械の中で、何千羽ものひなと一緒にふ化します。母鳥があなたの卵を温めたことは一度もありません。親には会えないまま育ちます。'), { O: -10 }, 'Birth');
    E(L, .15, m('You are sorted on a belt, vaccinated, and put in a box with about a hundred others.', 'ベルトコンベアの上で選別され、ワクチンを受けて、100羽ほどと同じ箱に入れられます。'), {}, 'Hatchery');
    E(L, .6, m('A truck takes you to the grow-out farm. Some chicks wait hours in the box without food or water before they are placed.', 'トラックで育てる農場へ。鶏舎に入るまでの何時間か、餌も水もない箱の中で待たされるひなもいます。'), { C: -6 }, 'Transport');
    E(L, 1.2, fast ? m('The house is one long floor of wood shavings under artificial light, holding tens of thousands of birds. Heaters keep you warm. A hen would have done this.', '鶏舎は、木くずを敷いた長い一枚の床です。人工の光のもとに数万羽。体を温めるのはヒーターで、本当なら母鳥の仕事でした。') : m('The house is bright, with a floor of shavings and some things to climb on. Other birds are everywhere.', '鶏舎は明るく、木くずの床と、登れる台があります。まわりは仲間でいっぱいです。'), { C: -4 }, 'Housing');
    E(L, 7, fast ? m('You are about four times your hatch weight. Broiler growth has gone from roughly 25 g a day to roughly 100 g a day in fifty years of breeding.', '体重はふ化したときの約4倍。ブロイラーの成長は、50年の品種改良で1日25gほどから100gほどに上がりました。') : m('You are growing steadily. You still have a long way to go.', '順調に育っています。出荷まではまだ日があります。'), { H: -3 }, 'Growth');
    E(L, [16, 28], m('Your heart and legs are growing slower than your breast muscle. Standing takes effort now. You spend more of each day lying down.', '心臓と脚の成長が、胸の筋肉の成長に追いつきません。立っているだけで疲れて、1日の大半を座って過ごすようになります。'), { H: -12, B: -14, C: -6 }, 'Health', fast ? 1 : 0);
    E(L, [20, 34], m('The litter under you is wet with droppings. Ammonia builds up. Your feet and hocks start to burn where they touch it. In surveys, 22% to 79% of broilers had foot-pad dermatitis.', '足もとの敷料はふんで湿り、アンモニアがたまります。触れている足の裏やかかとが、ただれ始めました。調査では、ブロイラーの22〜79％に足裏の皮膚炎がありました。'), { H: -12, C: -14 }, 'Health', fast ? .5 : .12);
    E(L, [18, 32], m('You are one of the birds that struggle to walk. In one UK survey 27.6% of broilers had walking problems, and 3.3% could almost not walk.', '歩くのがつらい1羽になってしまいました。英国のある調査では、ブロイラーの27.6％に歩行の問題があり、3.3％はほとんど歩けない状態でした。'), { H: -18, B: -16, C: -10 }, 'Health', fast ? .28 : .03);
    E(L, [10, 40], m('The lights stay on most of the day. Rest is broken. A chicken in nature roosts at dusk and sleeps in the dark.', '照明は一日のほとんどついたままで、眠りは細切れです。自然のニワトリは夕方に止まり木へ上がり、暗い中で眠ります。'), { C: -6, B: -6 }, 'Housing', fast ? 1 : .3);
    if (!fast) E(L, [20, 45], m('You can reach perches and pecking material. You dust-bathe. Some days you are at the far end of the house with a small group.', '止まり木やつつける物に届きます。砂浴びもできます。数羽で鶏舎の奥まで行き、ゆっくりする日もあります。'), { B: 10, C: 6 }, 'Behaviour');
    if (s === 'out') E(L, [30, 55], m('The door opens in the morning. You walk out onto grass for the first time.', '朝になって戸が開きました。生まれて初めて、草の上に出ます。'), { B: 20, C: 10, O: 6 }, 'Behaviour');
    final(L,

    stages(L, [[m('Hatchery', 'ふ化場'), 0], [m('Grow-out house', '肥育鶏舎'), 1], [m('Catching and transport', '捕獲と輸送'), L.end - 1], [m('Slaughter', '屠殺'), L.end - .05]]);
  } };

const W_REAL = { broiler: 66, layerF: 5, layerM: 5, duck: 4.2, turkey: .65, pig: 1.5, sheep: .6, beef: .2, dairyF: .06, dairyM: .11, rabbit: .4 };
const W_EQUAL = Object.fromEntries(Object.keys(W_REAL).map(k => [k, 1]));

function newLife(sp, o) {
  const L = { sp, o, ev: [], st: [], end: 1, cause: null, slaughtered: true, base: { H: 80, C: 60, B: 50, O: 40 }, slope: { H: 0, C: 0, B: 0, O: 0 }, typ: 100, t: 0, i: 0, mins: o.mins || 6, acc: { H: 0, C: 0, B: 0, O: 0 }, fired: [] };
  SP[sp].build(L);
  L.ev.sort((a, b) => a.d - b.d);
  L.label = SP[sp].label; L.nat = SP[sp].nat; L.natDays = SP[sp].natDays; L.nature = SP[sp].nature;
  L.playSec = clamp(L.mins * 60 * L.end / L.typ, 40, L.mins * 60 * 1.6);
  L.rate = L.end / L.playSec;
  if (L.ev.length) L.ev[0].P = 0;
  if (L.end > 3) {
    let best = null;
    for (const e of L.ev) if (e.d > L.end * .3 && e.d < L.end * .7 && (!best || Math.abs(e.d - L.end * .5) < Math.abs(best.d - L.end * .5))) best = e;
    if (best) best.P = 1;
    const pre = L.ev.filter(e => e.d > L.end * .7 && e.d < L.end - .01);
    if (pre.length) pre[pre.length - 1].P = 2;
  }
  return L;
}

const A = { mode: 'equal', mins: 6, speed: 1, paused: false, V: 'home', L: null, H: [], hist: [], t0: Date.now(), pausedFor: null, last: 0 };
function setView(v) { A.V = v; for (const id of ['home', 'life', 'end']) $(id).classList.toggle('hide', id !== v); window.scrollTo(0, 0); }
function seg(id, cb) { const el = $(id); el.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; [...el.children].forEach(c => c.classList.toggle('on', c === b)); cb(b.dataset.v); }); }

function born() {
  const w = A.mode === 'real' ? W_REAL : W_EQUAL;
  A.L = newLife(wpick(w), { mins: A.mins });
  A.H = Array.from({ length: 4 }, () => newLife(wpick(w), { mins: A.mins }));
  A.hist = []; A.speed = 1; A.paused = false; A.pausedFor = null;
  [...$('segSpeed').children].forEach(c => c.classList.toggle('on', c.dataset.v === '1'));
  $('btnPause').textContent = ui('pause'); $('btnResume').classList.add('hide');
  $('pauseCard').classList.add('hide'); $('stats').innerHTML = '';
  relife(true); setView('life');
  A.last = performance.now(); requestAnimationFrame(tick);
}
// (re)draw everything that depends on language or on the life
function relife(fresh) {
  const L = A.L; if (!L) return;
  $('heroPic').innerHTML = PIC[ICON_OF[L.sp]]; $('heroPic').parentElement.style.setProperty('--ic', COLOR_OF[L.sp]);
  $('heroKind').textContent = tx(L.label); $('heroSys').textContent = tx(L.sysName);
  $('heroSex').textContent = L.sex ? tx(SX[L.sex]) : '';
  $('natTxt').textContent = tx(L.nat);

  $('log').innerHTML = ''; for (const e of L.fired) addLog(e);

}
const SLAB = { H: [['Health', '健康'], '--H'], C: [['Comfort', '快適さ'], '--C'], B: [['Behaviour', '行動'], '--B'], O: [['Company', '仲間'], '--O'] };
const slab = k => SLAB[k][0][LANG === 'ja' ? 1 : 0];
function statsNow(L) { const f = clamp(L.t / L.end, 0, 1), o = {}; for (const k of 'HCBO') o[k] = clamp(L.base[k] + (L.slope[k] || 0) * f + L.acc[k], 3, 100); return o; }
function renderStats(rebuild) {
  const s = statsNow(A.L), el = $('stats');
  if (rebuild || !el.children.length) el.innerHTML = Object.keys(SLAB).map(k => `<div class="stat"><div class="lbl"><span>${slab(k)}</span><span id="sv${k}"></span></div><div class="bar"><i id="sb${k}" style="background:var(${SLAB[k][1]})"></i></div></div>`).join('');
  for (const k in SLAB) { $('sv' + k).textContent = Math.round(s[k]); $('sb' + k).style.width = s[k] + '%'; }
}
const STC = ['#7a8f6f', '#a9895a', '#6f8da6', '#a37c9b', '#8a6f6f'];
function buildStrip() {
  const L = A.L; let h = '';
  L.st.forEach((s, i) => { const nx = L.st[i + 1] ? L.st[i + 1][1] : L.end; const w = Math.max(1, (nx - s[1]) / L.end * 100); h += `<span title="${tx(s[0])}" style="width:${w}%;background:${STC[i % STC.length]}"></span>`; });
  $('strip').innerHTML = h + '<div class="now" id="now" style="left:0"></div>';
}
const stageName = L => { let n = null; for (const s of L.st) if (L.t >= s[1]) n = s[0]; return tx(n); };

function addLog(e) {

}
function fire(e) {

  if (e.fx.H === -100) { for (const k of 'HCBO') L.acc[k] -= 200; }
  else for (const k in e.fx) L.acc[k] += e.fx[k];

}

}
function sampleHist() { const L = A.L, f = L.t / L.end, last = A.hist[A.hist.length - 1]; if (!last || f - last.f > .01) A.hist.push(Object.assign({ f }, statsNow(L))); }

function tick(now) {
  if (A.V !== 'life') return;
  const L = A.L, dt = Math.min(.1, (now - A.last) / 1000); A.last = now;
  if (!A.paused && !A.pausedFor) {
    if (L.t < L.end) L.t = Math.min(L.end, L.t + dt * L.rate * A.speed);
    while (L.i < L.ev.length && L.ev[L.i].d <= L.t + 1e-9) {
      const e = L.ev[L.i++]; fire(e);
      if (e.fin) { L.t = L.end; finish(); return; }
      if (A.pausedFor) break;
    }
    sampleHist();

  $('lAge').textContent = ageTxt(L.t);

  const pct = L.t / L.natDays * 100;
  $('natFill').style.width = Math.max(.6, pct) + '%';
  $('natPct').textContent = LANG === 'ja' ? `ここまで${spanTxt(L.t)}。自然な寿命の${pct < 10 ? pct.toFixed(1) : Math.round(pct)}％にあたります。` : `${spanTxt(L.t)} so far, ${pct < 10 ? pct.toFixed(1) : Math.round(pct)}% of a natural lifespan.`;
  renderStats(); renderHM();
  requestAnimationFrame(tick);
}
function renderHM() {
  const L = A.L;
  $('hm').innerHTML = A.H.map(h => {
    const ht = Math.min(h.end, L.t * (h.rate / L.rate)), dead = ht >= h.end;
    const st = dead ? (LANG === 'ja' ? (h.slaughtered ? '屠殺・' : '死亡・') : (h.slaughtered ? 'Slaughtered, ' : 'Died, ')) + ageTxt(h.end).replace(' old', '') : ageTxt(ht);
    return `<div class="hm ${dead ? 'd' : ''}"><div>${tx(h.label)}</div><div class="s">${st}</div><div class="small muted" style="grid-column:1/3">${tx(h.sysName)}${dead && !h.slaughtered ? ' · ' + tx(h.cause) : ''}</div></div>`;
  }).join('');
}

function finish() {
  const L = A.L; sampleHist();
  const t = store.get('fl.lives', []); t.push({ sp: L.sp, end: Math.round(L.end * 10) / 10, ts: Date.now() }); store.set('fl.lives', t.slice(-200));
  A.pausedFor = null;
  setTimeout(() => { endScreen(); setView('end'); }, 1500);
}
function endScreen() {
  const L = A.L, pct = L.end / L.natDays * 100, ja = LANG === 'ja';
  $('endPic').innerHTML = PIC[ICON_OF[L.sp]]; $('endPic').parentElement.style.setProperty('--ic', COLOR_OF[L.sp]);
  $('eTitle').textContent = tx(L.label) + ' · ' + tx(L.sysName);
  $('eHead').textContent = ja ? spanTxt(L.end) + 'の生涯でした。' : 'You lived ' + spanTxt(L.end) + '.';
  $('eCause').textContent = (L.slaughtered ? '' : (ja ? '原因：' : 'Cause: ')) + tx(L.cause) + (ja ? '。' : '.');
  const ps = pct < 10 ? pct.toFixed(1) : Math.round(pct);
  $('eNat').innerHTML = ja ? `この動物の自然な寿命は<b>${tx(L.nat)}</b>ほど。あなたが生きたのは、そのうち<b>${ps}％</b>です。` : `A natural lifespan for this animal is about <b>${tx(L.nat)}</b>. You lived <b>${ps}%</b> of it.`;
  $('eSpark').innerHTML = spark(); surv();
  const share = Math.round((W_REAL[L.sp] / Object.values(W_REAL).reduce((a, b) => a + b, 0)) * 100);
  $('eNotes').innerHTML = `<h2>${ja ? 'この生涯の背景' : 'What shaped this life'}</h2><p>${tx(L.sysLine)}</p><p class="small muted">${ja ? `飼育方式の種類と確率は、世界でどのくらい一般的かをもとにした大まかな推定です。どこまでが出典つきで、どこからが推定かは、ホーム画面のリンク先の一覧にまとめています。生涯のおよそ${share}％は、このように始まります。` : `The housing systems and their odds are rough estimates of how common each is worldwide. The source list (linked on the home page) shows what is sourced and what is not. About ${share}% of lives start like this one.`}</p>`;
}
function spark() {
  const w = 600, h = 150, pad = 26, pts = A.hist;
  if (pts.length < 2) return `<p class="muted small">${LANG === 'ja' ? 'この生涯は短すぎて、グラフにできませんでした。' : 'This life was too short to draw.'}</p>`;
  let s = `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">`;
  for (const k in SLAB) {
    const d = pts.map((p, i) => (i ? 'L' : 'M') + (pad + p.f * (w - 2 * pad)).toFixed(1) + ' ' + (h - pad - (clamp(p[k], 0, 100) / 100) * (h - 2 * pad)).toFixed(1)).join(' ');
    s += `<path d="${d}" fill="none" stroke="var(${SLAB[k][1]})" stroke-width="3"/>`;
  }
  s += `<text x="${pad}" y="${h - 6}">${LANG === 'ja' ? '誕生' : 'Start'}</text><text x="${w - pad - 24}" y="${h - 6}">${LANG === 'ja' ? '最期' : 'End'}</text></svg>`;
  return s + '<div>' + Object.keys(SLAB).map(k => `<span style="color:var(${SLAB[k][1]})">&#9632;</span> ${slab(k)}`).join(' &nbsp; ') + '</div>';
}
function surv() {
  const L = A.L, N = 400, ends = [];
  for (let i = 0; i < N; i++) { try { ends.push(newLife(L.sp, { sys: L.sys, sex: L.sex, mins: A.mins }).end); } catch (e) {} }
  ends.sort((a, b) => a - b);
  const max = Math.max(...ends, L.end) * 1.05, w = 600, h = 170, pad = 28;
  let d = `M${pad} ${pad}`, alive = ends.length;
  ends.forEach(e => { const x = pad + (e / max) * (w - 2 * pad); d += ` L${x.toFixed(1)} ${(pad + (1 - alive / ends.length) * (h - 2 * pad)).toFixed(1)} L${x.toFixed(1)} ${(pad + (1 - (alive - 1) / ends.length) * (h - 2 * pad)).toFixed(1)}`; alive--; });
  const mx = pad + (L.end / max) * (w - 2 * pad), ja = LANG === 'ja';
  $('eSurv').innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img"><path d="${d}" fill="none" stroke="var(--fg)" stroke-width="2.5"/><line x1="${mx}" x2="${mx}" y1="${pad}" y2="${h - pad}" stroke="var(--accent)" stroke-dasharray="4 3" stroke-width="2"/><text x="${pad}" y="${pad - 8}">${ja ? '生存率100％' : '100% alive'}</text><text x="${pad}" y="${h - 6}">${ja ? '誕生' : 'Birth'}</text><text x="${w - pad - 70}" y="${h - 6}">${spanTxt(max)}</text><text x="${Math.min(mx + 5, w - 60)}" y="${pad + 14}">${ja ? 'あなた' : 'you'}</text></svg>`;
  const early = ends.filter(e => e < L.typ * .85).length, pc = Math.round(early / ends.length * 100);
  $('eSurvTxt').textContent = ja ? `同じ飼育方式の100頭のうち${pc}頭は、ふつうの出荷時期より前に亡くなりました。残りは、ほぼ同じ日齢で屠殺されています。` : `${pc} of every 100 animals in this system died before the usual slaughter age. Everyone else is slaughtered at close to the same age.`;
}
function renderTally() {
  const t = store.get('fl.lives', []);
  if (!t.length) { $('tallyBody').textContent = ui('tallyNone'); return; }
  const c = {}; t.forEach(x => { c[x.sp] = (c[x.sp] || 0) + 1; });
  $('tallyBody').innerHTML = `<p>${LANG === 'ja' ? `これまで${t.length}回生まれました：` : `${t.length} so far: `}` + Object.entries(c).map(([k, v]) => `${tx(SP[k].label)} ×${v}`).join(LANG === 'ja' ? '、' : ', ') + `</p><button id="btnClear">${ui('tallyClear')}</button>`;
  $('btnClear').onclick = () => { store.set('fl.lives', []); renderTally(); };
}

/* ---------- counters ---------- */
setInterval(() => {
  const s = (Date.now() - A.t0) / 1000, n = Math.floor(s * 87896729120 / 31557600);
  $('cSlaughter').textContent = n.toLocaleString(LANG === 'ja' ? 'ja-JP' : 'en-US');
  $('cChick').textContent = Math.floor(n * .78).toLocaleString(LANG === 'ja' ? 'ja-JP' : 'en-US');
}, 200);

/* ---------- sources ---------- */
const SRC = [
  [['Land animals slaughtered, 87.9 billion in 2024 (FAOSTAT via Faunalytics)', '2024年に屠殺された陸の動物は879億頭（FAOSTAT、Faunalytics経由）'], 'https://faunalytics.org/global-animal-slaughter-statistics-and-charts/'],
  [['Farmed animals alive at any time; share factory-farmed (Our World in Data)', '同時に生きている家畜の数と工場式の割合（Our World in Data）'], 'https://ourworldindata.org/how-many-animals-are-factory-farmed'],
  [['Broiler growth, leg disorders, mortality (FAO)', 'ブロイラーの成長・脚の障害・死亡率（FAO）'], 'https://www.fao.org/docrep/013/al723e/al723e00.pdf'],
  [['Keel bone fractures in laying hens', '採卵鶏の竜骨骨折'], 'https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5835507/'],
  [['Hen housing systems (Our World in Data)', '採卵鶏の飼育方式（Our World in Data）'], 'https://ourworldindata.org/do-better-cages-or-cage-free-environments-really-improve-the-lives-of-hens'],
  [['Share of hens in cages worldwide (WATTAgNet)', '世界のケージ飼育の割合（WATTAgNet）'], 'https://wattagnet.com/articles/45072-how-laying-hens-are-kept-around-the-world'],
  [['Turkeys: slaughter ages, mutilations, EFSA (transect-walk study)', '七面鳥：屠殺日齢・身体の切除・EFSA（現場調査）'], 'https://pmc.ncbi.nlm.nih.gov/articles/PMC8614380/'],
  [['Rabbits: EFSA opinion on different production systems', 'ウサギ：EFSAの意見（飼育方式の比較）'], 'https://efsa.onlinelibrary.wiley.com/doi/10.2903/j.efsa.2020.5944'],
  [['Pig life cycle (UC Davis CLEAR)', 'ブタのライフサイクル（UC Davis CLEAR）'], 'https://clear.ucdavis.edu/explainers/what-lifecycle-pig-market-production'],
  [['Sow housing and mortality', '母豚の飼育方式と死亡率'], 'https://www.ncbi.nlm.nih.gov/pmc/articles/PMC9379333/'],
  [['Sow replacement and parity at culling (Spain vs US)', '母豚の更新率と廃用時の産次（スペインと米国）'], 'https://www.3tres3.com/en/articles/comparison-of-swine-production-data-from-spain-and-usa_18169/'],
  [['Stun failures in cattle and pigs (Animal Welfare field study)', '牛とブタの気絶の失敗（現場調査）'], 'https://www.cambridge.org/core/journals/animal-welfare/article/identifying-reasons-for-stun-failures-in-slaughterhouses-for-cattle-and-pigs-a-field-study/F64422B1C2E441E3C73980F1A6F6C18C'],
  [['Dairy cow culling and longevity (FAWC)', '乳牛の淘汰と寿命（FAWC）'], 'https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/325044/FAWC_opinion_on_dairy_cow_welfare.pdf'],
  [['Lameness in British dairy cattle (meta-analysis)', '英国の乳牛の跛行（メタ分析）'], 'https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7468474/'],
  [['Pre-weaning dairy heifer mortality (USDA NAHMS)', '乳用子牛の離乳前死亡率（米国農務省NAHMS）'], 'https://www.aphis.usda.gov/animal_health/nahms/dairy/downloads/dairy17/morb-mort-us-prewean-dairy-heifer-nahms-2014.pdf'],
  [['Liver abscesses in feedlot cattle', '肥育牛の肝臓膿瘍'], 'https://www.canr.msu.edu/news/industry-concerns-with-liver-abscesses-in-finishing-cattle'],
  [['Bovine respiratory disease in feedlots (Oklahoma State)', '肥育場の牛呼吸器病（オクラホマ州立大）'], 'https://extension.okstate.edu:443/programs/beef-extension/beef-cattle-research-updates/site-files/docs/beef-cattle-research-update-september-2017-1.pdf'],
  [['Lamb mortality (FOUR PAWS, advocacy source)', '子羊の死亡率（FOUR PAWS、動物保護団体の資料）'], 'https://www.four-paws.org.au/our-stories/press-releases/2024/lamb-mortality'],
  [['Heat stress on live-export voyages', '生体輸出の船の熱ストレス'], 'https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7222853/'],
  [['Ducks in foie gras production (Cambridge)', 'フォアグラ生産のアヒル（ケンブリッジ大）'], 'https://neuroscience.cam.ac.uk/publications/the-welfare-of-ducks-during-foie-gras-production'],
  [['Pekin duck growth performance (Lohmann)', 'ペキンダックの成長（Lohmann）'], 'https://lohmann-breeders.com/ar/lohmanninfo/performance-of-current-peking-duck-breeds/']
];
function renderSources() {
  $('srcList').innerHTML = '<table><tbody>' + SRC.map(s => `<tr><td><a href="${s[1]}" target="_blank" rel="noopener">${s[0][LANG === 'ja' ? 1 : 0]}</a></td></tr>`).join('') + '</tbody></table>';
}

/* ---------- wiring ---------- */
seg('segLang', v => { LANG = v; store.set('fl.lang', v); applyLang(); });
seg('segMode', v => { A.mode = v; $('modeHelp').textContent = ui(v === 'real' ? 'modeRealHelp' : 'modeEqualHelp'); });
seg('segLen', v => { A.mins = +v; });
seg('segSpeed', v => { A.speed = +v; });
$('btnBorn').onclick = born; $('btnAgain').onclick = born;
$('btnPause').onclick = () => { A.paused = !A.paused; $('btnPause').textContent = ui(A.paused ? 'play' : 'pause'); };
$('btnNext').onclick = () => { const L = A.L; if (A.pausedFor) return; const e = L.ev[L.i]; if (e) L.t = Math.max(L.t, e.d - .001); };
$('btnCont').onclick = () => {
  const note = $('pNote').value.trim();
  if (note) { const n = store.get('fl.notes', []); n.push({ sp: A.L.sp, age: ageTxt(A.L.t), note, ts: Date.now() }); store.set('fl.notes', n.slice(-100)); }
  $('pNote').value = ''; A.pausedFor = null; $('pauseCard').classList.add('hide'); A.last = performance.now();
};
$('btnHome').onclick = () => { A.paused = true; $('btnResume').classList.remove('hide'); renderTally(); setView('home'); };
$('btnHome2').onclick = () => { renderTally(); setView('home'); };
$('btnResume').onclick = () => { setView('life'); A.paused = false; $('btnPause').textContent = ui('pause'); A.last = performance.now(); requestAnimationFrame(tick); };
applyLang();
</script>
